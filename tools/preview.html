<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-550w-boot · 冻结帧预览</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Freeze the CSS timeline at ?t=<seconds> so a single screenshot captures an
     exact moment of the sequence. */
  * { animation-play-state: paused !important; }
</style>
</head>
<body>
<div id="mount"></div>
<script src="react.production.min.js"></script>
<script>
  // ── freeze-frame ────────────────────────────────────────────────────────
  const T = Number(new URLSearchParams(location.search).get("t") || 0);
  document.documentElement.style.setProperty("--w550-t", "-" + T + "s");

  // The plugin's only timer retires its stylesheet at 5.6s; keep it out of the
  // way so a frozen frame is deterministic.
  const realSetTimeout = window.setTimeout.bind(window);
  window.setTimeout = (fn, ms) => realSetTimeout(fn, ms >= 1000 ? 1e9 : ms);

  // ── minimal module loader + slot registry (same shape the app provides) ──
  const calls = { register: [], inject: [], disposed: 0 };
  let captured = null;
  window.__preview = { calls, get captured() { return captured; } };

  window.__ModuleLoader__ = {
    load(spec) { captured = spec; },
  };

  function boot() {
    const spec = captured;
    if (spec === null) throw new Error("client.js never called __ModuleLoader__.load");
    const exports = spec.factory((id) => {
      if (id === "react") return window.React;
      throw new Error("unexpected require: " + id);
    });

    const ctx = {
      effect(fn) { ctx.__dispose = fn(); },
      slots: {
        inject(name, cb) { calls.inject.push(name); return cb(); },
        register(meta, render) { calls.register.push(meta); ctx.__render = render; return () => {}; },
      },
    };
    exports.apply(ctx);
    window.__preview.inject = exports.inject;
    window.__preview.dispose = ctx.__dispose;
    window.__preview.registerCalls = calls.register;

    // ── tiny React-element → DOM renderer (no hooks in this plugin) ───────
    const SVG = new Set(["svg", "g", "circle", "line", "ellipse", "rect", "path",
      "text", "tspan", "defs", "radialGradient", "linearGradient", "stop",
      "polyline", "use"]);
    const kebab = (s) => s.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase());

    function render(node) {
      if (node === null || node === undefined || node === false) return null;
      if (Array.isArray(node)) {
        const frag = document.createDocumentFragment();
        for (const child of node) {
          const el = render(child);
          if (el !== null) frag.appendChild(el);
        }
        return frag;
      }
      if (typeof node === "string" || typeof node === "number") {
        return document.createTextNode(String(node));
      }
      const type = node.type;
      if (typeof type === "function") return render(type(node.props));
      const el = SVG.has(type)
        ? document.createElementNS("http://www.w3.org/2000/svg", type)
        : document.createElement(type);
      for (const [key, value] of Object.entries(node.props || {})) {
        if (key === "children" || key === "key" || value === undefined || value === null) continue;
        if (key === "className") el.setAttribute("class", value);
        else if (key === "style") {
          for (const [k, v] of Object.entries(value)) el.style.setProperty(kebab(k), String(v));
        } else if (key.startsWith("aria-") || SVG.has(type)) el.setAttribute(key, String(value));
        else el.setAttribute(kebab(key), String(value));
      }
      const kids = node.props && node.props.children;
      for (const child of Array.isArray(kids) ? kids : [kids]) {
        const el2 = render(child);
        if (el2 !== null) el.appendChild(el2);
      }
      return el;
    }

    const mount = document.getElementById("mount");
    const out = render(ctx.__render());
    if (out !== null) mount.appendChild(out);
    document.title = "T=" + T;

    // A/B switch: ?hide=.w550-grain,.w550-sweep hides named layers, so a suspect
    // layer can be isolated in a screenshot instead of reasoned about.
    const hide = new URLSearchParams(location.search).get("hide");
    if (hide) {
      const s = document.createElement("style");
      s.textContent = hide.split(",")
        .map((sel) => sel.trim() + "{display:none !important}").join("\n");
      document.head.appendChild(s);
    }

    // ?winbar=1 reproduces the desktop shell: `<html data-windows-titlebar>` plus a
    // 40px band drawn above the page (that is the Electron titleBarOverlay, which no
    // CSS of ours can reach). The colour here is the one the plugin hands the shell
    // through the two probed variables, so the screenshot shows the real thing.
    if (new URLSearchParams(location.search).get("winbar")) {
      document.documentElement.setAttribute("data-windows-titlebar", "");
      const bar = document.createElement("div");
      bar.style.cssText = "position:fixed;left:0;right:0;top:0;height:40px;z-index:99999;" +
        "background:#04060b;display:flex;align-items:center;justify-content:flex-end;" +
        "padding:0 14px;box-sizing:border-box;gap:26px;pointer-events:none";
      for (const glyph of ["\u2014", "\u25a1", "\u2715"]) {
        const i = document.createElement("i");
        i.textContent = glyph;
        i.style.cssText = "font:14px/1 system-ui,sans-serif;font-style:normal;color:#cfe2ff";
        bar.appendChild(i);
      }
      document.body.appendChild(bar);
    }

    // ?probe=1 prints the live geometry and computed opacity of every terminal
    // flow into the page, so "the lines are missing" can be told apart from
    // "the lines are clipped" or "the freeze never started them".
    if (new URLSearchParams(location.search).get("probe")) {
      realSetTimeout(() => {
        const lines = [];
        document.querySelectorAll(".w550-flow").forEach((el, i) => {
          const body = el.closest(".w550-body");
          const br = body.getBoundingClientRect();
          const fr = el.getBoundingClientRect();
          const kids = Array.from(el.children);
          const vis = kids.filter((k) => Number(getComputedStyle(k).opacity) > 0.5).length;
          lines.push("flow" + i + " body h=" + Math.round(br.height) + " top=" + Math.round(br.top) +
            " | flow h=" + Math.round(fr.height) + " top=" + Math.round(fr.top) +
            " | kids=" + kids.length + " opaque=" + vis + " scrollH=" + el.scrollHeight);
          const f = kids[0];
          const l = kids[kids.length - 1];
          if (f) lines.push("   first h=" + Math.round(f.getBoundingClientRect().height) +
            " top=" + Math.round(f.getBoundingClientRect().top) +
            " op=" + getComputedStyle(f).opacity + " delay=" + getComputedStyle(f).animationDelay);
          if (l) lines.push("   last  h=" + Math.round(l.getBoundingClientRect().height) +
            " top=" + Math.round(l.getBoundingClientRect().top) +
            " op=" + getComputedStyle(l).opacity + " delay=" + getComputedStyle(l).animationDelay);
        });
        const pre = document.createElement("pre");
        pre.style.cssText = "position:fixed;left:4px;top:4px;z-index:99999;color:#0f0;" +
          "font:10px/1.3 monospace;background:#000;padding:5px;margin:0";
        pre.textContent = lines.slice(0, 12).join("\n");
        document.body.appendChild(pre);
      }, 400);
    }
  }

  window.addEventListener("load", () => { try { boot(); } catch (e) { document.title = "ERR " + e.message; } });
</script>
<script>
  /* the plugin file changes on every edit and the headless browser happily caches
     a file:// script, which silently served me a stale splash twice — stamp it. */
  document.write('<script src="../lib/client.js?v=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
